[project]
name = "marketingadvisor-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.0",
    "google-genai>=3.3.0",
    "httpx>=0.28.1",
    "phonenumbers>=9.0.43",
    "playwright>=1.65.2",
    "pydantic-settings>=2.16.3",
    "rapidfuzz>=3.14.6",
    "selectolax>=1.0.2",
    "sqlmodel>=0.0.50",
    "sse-starlette>=3.7.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
