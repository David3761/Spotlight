<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Bară de jos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Navigare" style="width: 100%; height: 88px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #E4E9F0; padding: 8px 12px 22px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
    <a href="{{ t.href }}" aria-current="{{ t.current }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; border-radius: 14px; text-decoration: none; font-size: 11px; font-weight: 700; color: {{ t.fg }}">
      <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: {{ t.bg }}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.icon }}"></path></svg>
      </span>
      {{ t.name }}
    </a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"acasa","options":["acasa","gemini","capitole","asistent"]},"$preview":{"width":390,"height":88}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active || 'acasa';
    var tabs = [
      { key: 'acasa', name: 'Acasă', href: '/MPanou.dc.html', icon: 'M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z' },
      { key: 'gemini', name: 'Gemini', href: '/MGemini.dc.html', icon: 'M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5A8 8 0 1 1 21 12z' },
      { key: 'capitole', name: 'Capitole', href: '/MCapitol.dc.html', icon: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z' },
      { key: 'asistent', name: 'Asistent', href: '/MConversatii.dc.html', icon: 'M4 5h16v11H9l-5 4zM8 9.5h8M8 12.5h5' }
    ];
    return {
      tabs: tabs.map(function (t) {
        var on = t.key === active;
        t.current = on ? 'page' : 'false';
        t.fg = on ? '#1E40AF' : '#64748B';
        t.bg = on ? '#EAF1FE' : 'transparent';
        return t;
      })
    };
  }
}
</script>
</body>
</html>
