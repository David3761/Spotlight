<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Analiză în curs · mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F8FB}
*{box-sizing:border-box}
a{color:#2563EB}a:hover{color:#1D4ED8}
@keyframes dcSpin{to{transform:rotate(360deg)}}
@keyframes dcFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #F6F8FB; color: #0F172A; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 20px 32px; gap: 28px">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center">
    <div style="position: relative; width: 112px; height: 112px">
      <svg width="112" height="112" viewBox="0 0 112 112" aria-hidden="true" style="position: absolute; inset: 0"><circle cx="56" cy="56" r="48" fill="none" stroke="#EAF1FE" stroke-width="12"></circle></svg>
      <svg width="112" height="112" viewBox="0 0 112 112" aria-hidden="true" style="position: absolute; inset: 0; animation: dcSpin 1.6s linear infinite"><circle cx="56" cy="56" r="48" fill="none" stroke="#2563EB" stroke-width="12" stroke-linecap="round" stroke-dasharray="76 226"></circle></svg>
      <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; animation: dcFloat 2.4s ease-in-out infinite">
        <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z" fill="#2563EB"></path></svg>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Analizăm afacerea ta…</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #475569">Durează cam un minut.</p>
    </div>
  </div>

  <ol aria-live="polite" style="list-style: none; margin: 0; padding: 8px; background: #FFFFFF; border: 1px solid #E4E9F0; border-radius: 24px; display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{ steps }}" as="s" hint-placeholder-count="5">
      <li style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: {{ s.bg }}">
        <sc-if value="{{ s.done }}" hint-placeholder-val="{{ true }}">
          <span style="width: 30px; height: 30px; flex: none; border-radius: 50%; background: #2FB36E; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
        </sc-if>
        <sc-if value="{{ s.active }}" hint-placeholder-val="{{ false }}">
          <span style="width: 30px; height: 30px; flex: none; border-radius: 50%; border: 3px solid #C9D8F8; border-top-color: #2563EB; animation: dcSpin 0.9s linear infinite"></span>
        </sc-if>
        <sc-if value="{{ s.pending }}" hint-placeholder-val="{{ false }}">
          <span style="width: 30px; height: 30px; flex: none; border-radius: 50%; border: 2px dashed #CBD5E1"></span>
        </sc-if>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 700; color: {{ s.titleColor }}">{{ s.title }}</span>
          <span style="font-size: 12px; color: #64748B">{{ s.detail }}</span>
        </span>
      </li>
    </sc-for>
  </ol>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="height: 10px; border-radius: 5px; background: #E4E9F0; overflow: hidden">
      <div style="height: 10px; border-radius: 5px; background: #2563EB; width: {{ progress }}"></div>
    </div>
    <span style="font-size: 13px; font-weight: 600; color: #475569; text-align: center">{{ progressLabel }}</span>
  </div>

  <div style="margin-top: auto; background: #EAF1FE; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #1E40AF">Știai că?</span>
    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #1E3A8A">Gemini citește și ce scriu clienții în recenzii, ca să știe pe cine să recomande.</p>
  </div>
  <sc-if value="{{ finished }}" hint-placeholder-val="{{ false }}">
    <a href="MPanou.dc.html" style="height: 52px; border-radius: 999px; background: #2563EB; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; text-decoration: none">Vezi rezultatele</a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pas":{"editor":"range","default":3,"min":0,"max":5,"step":1},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var pas = Number(this.props.pas);
    if (!isFinite(pas)) pas = 3;
    var data = [
      ['Google', 'Am găsit Profilul tău Google', 'Căutăm Profilul tău Google…', 'Profilul tău Google'],
      ['Recenzii', 'Am citit 38 de recenzii', 'Citim recenziile…', 'Ce spun clienții'],
      ['Website', 'Am citit cafeneauaboema.ro', 'Citim site-ul…', 'cafeneauaboema.ro'],
      ['Rețele sociale', 'Am verificat Facebook și Instagram', 'Verificăm Facebook și Instagram…', 'Facebook și Instagram'],
      ['Gemini', 'I-am pus 12 întrebări', 'Îi punem lui Gemini 12 întrebări…', '12 întrebări ca ale clienților']
    ];
    var steps = data.map(function (d, i) {
      var done = i < pas, active = i === pas, pending = i > pas;
      return { title: d[0], detail: done ? d[1] : (active ? d[2] : d[3]), done: done, active: active, pending: pending,
        bg: active ? '#F3F7FF' : 'transparent', titleColor: pending ? '#64748B' : '#0F172A' };
    });
    var pct = Math.min(100, Math.round(((pas + (pas < 5 ? 0.5 : 0)) / 5) * 100));
    return { steps: steps, progress: pct + '%', finished: pas >= 5,
      progressLabel: pas >= 5 ? 'Gata!' : (pas + ' din 5 pași gata') };
  }
}
</script>
</body>
</html>
