<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Configurare · mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F8FB}
*{box-sizing:border-box}
a{color:#2563EB}a:hover{color:#1D4ED8}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #0F172A; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #EEF2F6">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="Înapoi" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; color: #334155; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
      <span style="font-size: 14px; font-weight: 700">Pasul 7 din 7</span>
      <button type="button" style="height: 44px; padding: 0 10px; border: none; background: transparent; color: #475569; font-size: 14px; font-weight: 600; cursor: pointer">Mai târziu</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 0 6px" role="progressbar" aria-label="Progres configurare" aria-valuemin="0" aria-valuemax="7" aria-valuenow="6">
      <span style="height: 5px; border-radius: 3px; background: #2563EB"></span>
      <span style="height: 5px; border-radius: 3px; background: #2563EB"></span>
      <span style="height: 5px; border-radius: 3px; background: #2563EB"></span>
      <span style="height: 5px; border-radius: 3px; background: #2563EB"></span>
      <span style="height: 5px; border-radius: 3px; background: #2563EB"></span>
      <span style="height: 5px; border-radius: 3px; background: #2563EB"></span>
      <span style="height: 5px; border-radius: 3px; background: #9DBBF7"></span>
    </div>
  </header>

  <div style="padding: 12px 16px 0">
    <div style="border: 1px solid #E4E9F0; border-radius: 20px; background: #F6F8FB; overflow: hidden">
      <button type="button" aria-expanded="{{ expandedAttr }}" onClick="{{ toggle }}" style="width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: none; background: transparent; cursor: pointer; text-align: left; color: inherit">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 13px; background: #EAF1FE; color: #1E40AF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">CB</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 700">Cartea de vizită</span>
          <span style="font-size: 12px; color: #64748B">6 din 7 completate</span>
        </span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{ chevron }}; transition: transform 200ms ease"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <sc-if value="{{ expanded }}" hint-placeholder-val="{{ false }}">
        <ul style="list-style: none; margin: 0; padding: 0 14px 10px; display: flex; flex-direction: column">
          <sc-for list="{{ fields }}" as="f" hint-placeholder-count="7">
            <li style="display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #E9EEF5; font-size: 13px">
              <span style="width: 96px; flex: none; color: #64748B; font-weight: 600">{{ f.label }}</span>
              <span style="flex: 1; min-width: 0; font-weight: 600; color: {{ f.color }}">{{ f.value }}</span>
              <span style="width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{ f.dotBg }}; color: #157F45">
                <sc-if value="{{ f.done }}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
              </span>
            </li>
          </sc-for>
        </ul>
      </sc-if>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 16px">
    <div style="display: flex; gap: 8px; align-items: flex-end">
      <div style="width: 28px; height: 28px; flex: none; border-radius: 50%; background: #EAF1FE; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z" fill="#2563EB"></path></svg></div>
      <p style="margin: 0; background: #F1F4F9; border-radius: 18px 18px 18px 6px; padding: 10px 14px; font-size: 14px; line-height: 1.5">Ai Facebook, Instagram sau TikTok? Lipește linkurile. Poți sări peste oricare.</p>
    </div>
    <p style="margin: 0; align-self: flex-end; background: #2563EB; color: #FFFFFF; border-radius: 18px 18px 6px 18px; padding: 9px 14px; font-size: 14px; font-weight: 600">facebook.com/cafeneauaboema</p>
    <p style="margin: 0; align-self: flex-end; background: #2563EB; color: #FFFFFF; border-radius: 18px 18px 6px 18px; padding: 9px 14px; font-size: 14px; font-weight: 600">instagram.com/cafeneauaboema</p>
    <p style="margin: 0; align-self: flex-end; background: #EEF2F6; color: #475569; border-radius: 18px 18px 6px 18px; padding: 9px 14px; font-size: 14px; font-weight: 600">TikTok · Sar peste</p>
    <div style="display: flex; gap: 8px; align-items: flex-end">
      <div style="width: 28px; height: 28px; flex: none; border-radius: 50%; background: #EAF1FE; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z" fill="#2563EB"></path></svg></div>
      <p style="margin: 0; background: #F1F4F9; border-radius: 18px 18px 18px 6px; padding: 10px 14px; font-size: 14px; line-height: 1.5">Ultima întrebare! Mai ești și pe alte platforme? Alege tot ce se potrivește.</p>
    </div>
    <div role="group" aria-label="Alte platforme" style="display: flex; flex-wrap: wrap; gap: 8px; padding-left: 36px">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="6">
        <button type="button" aria-pressed="{{ c.pressed }}" onClick="{{ c.toggle }}" style="height: 44px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; border: {{ c.border }}; background: {{ c.bg }}; color: {{ c.fg }}; font-weight: {{ c.weight }}">
          <sc-if value="{{ c.on }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
          {{ c.name }}
        </button>
      </sc-for>
    </div>
  </div>

  <div style="padding: 12px 16px 28px; border-top: 1px solid #EEF2F6; display: flex; flex-direction: column; gap: 6px">
    <a href="MAnaliza.dc.html" style="height: 52px; border-radius: 999px; background: #2563EB; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700; text-decoration: none">{{ ctaLabel }}</a>
    <button type="button" style="height: 44px; border: none; background: none; color: #475569; font-size: 14px; font-weight: 600; cursor: pointer">Nu folosesc altele</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"cardOpen":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var expanded = st.expanded != null ? st.expanded : (this.props.cardOpen === true || this.props.cardOpen === 'true');
    var sel = st.sel || { Glovo: true, Wolt: true };
    var names = ['TripAdvisor', 'Glovo', 'Wolt', 'Bolt Food', 'Booking', 'Booksy'];
    var count = names.filter(function (n) { return sel[n]; }).length;
    var chips = names.map(function (n) {
      var on = !!sel[n];
      return {
        name: n, on: on, pressed: on ? 'true' : 'false',
        border: on ? '2px solid #2563EB' : '1px solid #E4E9F0',
        bg: on ? '#EAF1FE' : '#FFFFFF', fg: on ? '#1E40AF' : '#334155', weight: on ? '700' : '600',
        toggle: function () { var next = Object.assign({}, sel); next[n] = !on; self.setState({ sel: next }); }
      };
    });
    var f = function (label, value, done) { return { label: label, value: value, done: done, color: done ? '#0F172A' : '#1D4ED8', dotBg: done ? '#E5F6EC' : '#EAF1FE' }; };
    return {
      expanded: expanded,
      expandedAttr: expanded ? 'true' : 'false',
      chevron: expanded ? 'rotate(180deg)' : 'rotate(0deg)',
      toggle: function () { self.setState({ expanded: !expanded }); },
      chips: chips,
      ctaLabel: count > 0 ? 'Gata, analizează afacerea (' + count + (count === 1 ? ' platformă)' : ' platforme)') : 'Gata, analizează afacerea',
      fields: [
        f('Nume', 'Cafeneaua Boema', true),
        f('Tip', 'Cafenea', true),
        f('Locație', 'Cotroceni, București', true),
        f('Site', 'cafeneauaboema.ro', true),
        f('Google Maps', 'Str. Dr. Lister, Cotroceni', true),
        f('Rețele sociale', 'Facebook, Instagram', true),
        f('Alte platforme', count > 0 ? names.filter(function (n) { return sel[n]; }).join(', ') : 'Alegi acum…', false)
      ]
    };
  }
}
</script>
</body>
</html>
