<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Conversații · mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F8FB}
*{box-sizing:border-box}
a{color:#2563EB}a:hover{color:#1D4ED8}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #F6F8FB; color: #0F172A; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 10px 20px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Conversații</h1>
    <a href="MChat.dc.html" aria-label="Conversație nouă" style="width: 44px; height: 44px; border-radius: 50%; background: #2563EB; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
  </header>
  <div style="padding: 0 16px 12px">
    <div style="height: 46px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E4E9F0; display: flex; align-items: center; gap: 10px; padding: 0 16px; color: #64748B">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>
      <label for="mSearch" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Caută în conversații</label>
      <input id="mSearch" type="search" placeholder="Caută în conversații…" style="flex: 1; border: none; background: transparent; font-size: 15px; color: #0F172A; outline: none">
    </div>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #64748B">{{ g.label }}</h2>
        <div style="background: #FFFFFF; border: 1px solid #E4E9F0; border-radius: 22px; overflow: hidden">
          <sc-for list="{{ g.items }}" as="c" hint-placeholder-count="3">
            <a href="MChat.dc.html" style="display: flex; align-items: flex-start; gap: 12px; padding: 14px; text-decoration: none; color: #0F172A; border-top: {{ c.divider }}">
              <span style="width: 40px; height: 40px; flex: none; border-radius: 13px; background: #F1F4F9; color: #2563EB; display: flex; align-items: center; justify-content: center">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ c.icon }}"></path></svg>
              </span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
                <span style="display: flex; justify-content: space-between; gap: 8px">
                  <span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ c.title }}</span>
                  <span style="font-size: 12px; font-weight: 600; color: #64748B; flex: none">{{ c.time }}</span>
                </span>
                <span style="font-size: 13px; color: #475569; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ c.preview }}</span>
                <sc-if value="{{ c.hasSolved }}" hint-placeholder-val="{{ false }}">
                  <span style="align-self: flex-start; height: 22px; padding: 0 8px 0 5px; border-radius: 999px; background: #E5F6EC; color: #157F45; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 4px">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
                    {{ c.solved }}
                  </span>
                </sc-if>
              </span>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <dc-import name="TabBar" active="asistent" hint-size="390px,88px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var I = {
      pin: 'M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21zM12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z',
      star: 'M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z',
      eye: 'M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7S2.5 12 2.5 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
      store: 'M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9h16M9 20v-6h6v6'
    };
    var c = function (title, preview, icon, time, solved) { return { title: title, preview: preview, icon: icon, time: time, hasSolved: !!solved, solved: solved || '' }; };
    var div = function (items) { return items.map(function (it, i) { it.divider = i === 0 ? 'none' : '1px solid #F1F4F9'; return it; }); };
    return {
      groups: [
        { label: 'Azi', items: div([
          c('Am pus descrierea și pozele pe Google', 'Asistent: Gata! Am marcat 2 probleme ca rezolvate.', I.pin, '14:12', '2 rezolvate'),
          c('Cum răspund la o recenzie negativă?', 'Tu: Un client a scris că a așteptat mult la cafea…', I.star, '11:40'),
          c('Ce poze să pun pe Google?', 'Asistent: Începe cu interiorul la lumina zilei…', I.pin, '09:15')
        ]) },
        { label: 'Ieri', items: div([
          c('Ce înseamnă „Site-ul, văzut de Gemini”?', 'Asistent: Pe scurt, verificăm dacă Gemini îți poate citi site-ul.', I.eye, '19:22'),
          c('Configurarea afacerii', 'Asistent: Gata! Am pornit analiza.', I.store, '18:05')
        ]) }
      ]
    };
  }
}
</script>
</body>
</html>
