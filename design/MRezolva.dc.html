<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Rezolvare · mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F8FB}
*{box-sizing:border-box}
a{color:#2563EB}a:hover{color:#1D4ED8}
button,textarea{font-family:inherit}
@keyframes dcSheetUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes dcFade{from{opacity:0}to{opacity:1}}
@keyframes dcSkel{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes dcDot{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-4px);opacity:1}}
@keyframes dcToastIn{0%{transform:translate(-50%,16px);opacity:0}60%{transform:translate(-50%,-3px);opacity:1}100%{transform:translate(-50%,0);opacity:1}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F6F8FB; color: #0F172A; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 4px; padding: 10px 12px">
    <a href="MPanou.dc.html" aria-label="Înapoi la panou" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #334155">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-size: 15px; font-weight: 700; color: #475569">Panou</span>
  </header>
  <section style="padding: 0 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
    <dc-import name="ScoreRing" score="{{ socialScore }}" animate-from="55" size="128" thick="14" hint-size="128px,128px"></dc-import>
    <h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Rețele sociale</h1>
    <span style="height: 30px; padding: 0 12px; border-radius: 999px; background: #E5F6EC; color: #157F45; font-size: 13px; font-weight: 800; display: flex; align-items: center">+{{ possible }} puncte posibile</span>
  </section>
  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{ problems }}" as="p" hint-placeholder-count="3">
      <article style="background: #FFFFFF; border: 1px solid #E4E9F0; border-radius: 20px; padding: 14px; display: flex; align-items: center; gap: 12px">
        <span style="width: 44px; height: 44px; flex: none; border-radius: 14px; background: #E5F6EC; color: #157F45; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">+{{ p.pts }}</span>
        <span style="flex: 1; font-size: 14px; font-weight: 700; line-height: 1.35">{{ p.title }}</span>
        <button type="button" onClick="{{ p.open }}" style="height: 44px; padding: 0 14px; border-radius: 999px; border: none; background: #2563EB; color: #FFFFFF; font-size: 14px; font-weight: 700; cursor: pointer">Rezolvă</button>
      </article>
    </sc-for>
    <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 20px; background: #E5F6EC; color: #157F45; font-size: 14px; font-weight: 700; animation: dcFade 400ms ease both">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        Rezolvate · 1
      </div>
    </sc-if>
  </div>
  <div style="margin-top: auto">
    <dc-import name="TabBar" active="capitole" hint-size="390px,88px"></dc-import>
  </div>

  <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ true }}">
    <div onClick="{{ close }}" style="position: absolute; inset: 0; background: rgba(15,23,42,0.36); animation: dcFade 220ms ease both"></div>
    <section role="dialog" aria-modal="true" aria-labelledby="mFixTitle" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 780px; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -16px 40px rgba(15,23,42,0.18); display: flex; flex-direction: column; animation: dcSheetUp 300ms cubic-bezier(.2,.8,.2,1) both">
      <div style="display: flex; justify-content: center; padding: 10px 0 2px"><span style="width: 40px; height: 5px; border-radius: 3px; background: #CBD5E1"></span></div>
      <div style="padding: 8px 20px 14px; display: flex; align-items: flex-start; gap: 12px">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
          <span style="align-self: flex-start; height: 26px; padding: 0 10px; border-radius: 999px; background: #E5F6EC; color: #157F45; font-size: 12px; font-weight: 800; display: flex; align-items: center">+6 puncte</span>
          <h2 id="mFixTitle" style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em">Scrie descrierea pentru Instagram</h2>
        </div>
        <button type="button" aria-label="Închide" onClick="{{ close }}" style="width: 44px; height: 44px; flex: none; border-radius: 50%; border: none; background: #F1F4F9; color: #334155; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <div style="padding: 0 20px 14px; display: flex; flex-direction: column; gap: 14px">
        <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #475569">Gemini citește descrierea ca să afle ce faci și unde ești.</p>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="mBio" style="font-size: 14px; font-weight: 700">Descrierea ta</label>
          <sc-if value="{{ generating }}" hint-placeholder-val="{{ false }}">
            <div aria-live="polite" style="height: 150px; border-radius: 18px; border: 2px solid #E4E9F0; padding: 16px; display: flex; flex-direction: column; gap: 11px">
              <span style="height: 13px; width: 94%; border-radius: 7px; background: #E9EEF5; animation: dcSkel 1.2s ease-in-out infinite"></span>
              <span style="height: 13px; width: 100%; border-radius: 7px; background: #E9EEF5; animation: dcSkel 1.2s ease-in-out .15s infinite"></span>
              <span style="height: 13px; width: 68%; border-radius: 7px; background: #E9EEF5; animation: dcSkel 1.2s ease-in-out .3s infinite"></span>
              <span style="margin-top: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #1D4ED8">
                <span style="display: flex; gap: 4px">
                  <span style="width: 6px; height: 6px; border-radius: 50%; background: #2563EB; animation: dcDot 1s ease-in-out infinite"></span>
                  <span style="width: 6px; height: 6px; border-radius: 50%; background: #2563EB; animation: dcDot 1s ease-in-out .15s infinite"></span>
                  <span style="width: 6px; height: 6px; border-radius: 50%; background: #2563EB; animation: dcDot 1s ease-in-out .3s infinite"></span>
                </span>
                Scriem descrierea…
              </span>
            </div>
          </sc-if>
          <sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">
            <textarea id="mBio" value="{{ text }}" onChange="{{ onText }}" rows="5" aria-describedby="mCount" style="width: 100%; height: 150px; resize: none; border-radius: 18px; border: 2px solid #C9D8F8; padding: 14px 16px; font-size: 15px; line-height: 1.5; color: #0F172A; outline: none; animation: dcFade 300ms ease both"></textarea>
          </sc-if>
          <span id="mCount" style="align-self: flex-end; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{ countColor }}">{{ count }} / 150</span>
        </div>
        <div role="group" aria-label="Ton" style="display: flex; gap: 8px">
          <sc-for list="{{ tones }}" as="t" hint-placeholder-count="3">
            <button type="button" aria-pressed="{{ t.pressed }}" onClick="{{ t.pick }}" style="flex: 1; height: 44px; border-radius: 999px; font-size: 14px; cursor: pointer; border: {{ t.border }}; background: {{ t.bg }}; color: {{ t.fg }}; font-weight: {{ t.weight }}">{{ t.name }}</button>
          </sc-for>
        </div>
        <button type="button" onClick="{{ regen }}" style="align-self: center; height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: transparent; color: #1D4ED8; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4"></path></svg>
          Generează din nou
        </button>
      </div>
      <div style="padding: 12px 20px 28px; border-top: 1px solid #EEF2F6; display: flex; flex-direction: column; gap: 8px">
        <button type="button" onClick="{{ copy }}" style="height: 52px; border-radius: 999px; border: none; background: #2563EB; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ copyIcon }}"></path></svg>
          {{ copyLabel }}
        </button>
        <button type="button" onClick="{{ markDone }}" style="height: 50px; border-radius: 999px; border: 1px solid #C9D8F8; background: #FFFFFF; color: #1E40AF; font-size: 16px; font-weight: 700; cursor: pointer">Am rezolvat</button>
      </div>
    </section>
  </sc-if>

  <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 50%; bottom: 108px; transform: translate(-50%, 0); display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 20px 0 8px; border-radius: 999px; background: #0F172A; color: #FFFFFF; font-size: 15px; font-weight: 700; white-space: nowrap; box-shadow: 0 16px 36px rgba(15,23,42,0.28); animation: dcToastIn 520ms cubic-bezier(.2,.9,.3,1.2) both">
      <span style="width: 34px; height: 34px; border-radius: 50%; background: #2FB36E; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></span>
      +6 puncte
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stare":{"editor":"enum","default":"Text gata","options":["Se generează","Text gata","Rezolvat"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  texts() {
    return {
      Prietenos: [
        'Cafea de specialitate în inima Cotroceniului. Boabe proaspăt prăjite, croissante calde și un colț liniștit pentru laptop. Te așteptăm zilnic, 8–20.',
        'Cafeneaua ta din Cotroceni: espresso bun, prăjituri de casă și Wi-Fi rapid. Vino pentru o cafea, rămâi pentru atmosferă. Zilnic, 8–20.'
      ],
      Profesionist: [
        'Cafeneaua Boema · cafea de specialitate în Cotroceni, București. Espresso, filtru și patiserie proaspătă. Deschis zilnic, 8:00–20:00.',
        'Cafenea de specialitate în Cotroceni. Cafea prăjită local, patiserie zilnică, spațiu potrivit pentru lucru. Program: zilnic, 8:00–20:00.'
      ],
      Scurt: ['Cafea de specialitate în Cotroceni. Zilnic, 8–20.', 'Cafea bună și liniște, în Cotroceni. Zilnic, 8–20.']
    };
  }
  phaseFromProp() {
    var s = this.props.stare || 'Text gata';
    return s === 'Se generează' ? 'gen' : (s === 'Rezolvat' ? 'done' : 'ready');
  }
  componentDidUpdate(prev) {
    if (prev.stare !== this.props.stare) { clearTimeout(this._g); clearTimeout(this._t); this.setState({ phase: null, toast: null }); }
  }
  componentWillUnmount() { clearTimeout(this._g); clearTimeout(this._t); clearTimeout(this._c); }
  generate(tone, variant) {
    var self = this;
    clearTimeout(this._g);
    this.setState({ phase: 'gen', tone: tone, variant: variant, text: null });
    this._g = setTimeout(function () { self.setState({ phase: 'ready' }); }, 1500);
  }
  renderVals() {
    var self = this;
    var st = this.state || {};
    var phase = st.phase || this.phaseFromProp();
    var tone = st.tone || 'Prietenos';
    var variant = st.variant || 0;
    var T = this.texts();
    var text = st.text != null ? st.text : T[tone][variant % T[tone].length];
    var isDone = phase === 'done';
    var all = [
      { id: 1, pts: 6, title: 'Descrierea de pe Instagram nu spune ce faci și unde ești' },
      { id: 2, pts: 5, title: 'Pagina de Facebook nu are linkul către site' },
      { id: 3, pts: 4, title: 'Nicio postare pe TikTok în ultimele 60 de zile' }
    ];
    var problems = all.filter(function (p) { return !(isDone && p.id === 1); }).map(function (p) {
      p.open = function () { if (p.id === 1) self.generate(tone, variant); };
      return p;
    });
    return {
      socialScore: isDone ? 61 : 55,
      possible: problems.reduce(function (a, p) { return a + p.pts; }, 0),
      problems: problems,
      isDone: isDone,
      sheetOpen: phase === 'gen' || phase === 'ready',
      generating: phase === 'gen',
      ready: phase === 'ready',
      text: text,
      count: phase === 'gen' ? '–' : text.length,
      countColor: text.length > 150 ? '#B42318' : '#475569',
      onText: function (e) { self.setState({ text: e.target.value }); },
      tones: ['Prietenos', 'Profesionist', 'Scurt'].map(function (n) {
        var on = n === tone;
        return { name: n, pressed: on ? 'true' : 'false', border: on ? '2px solid #2563EB' : '1px solid #E4E9F0', bg: on ? '#EAF1FE' : '#FFFFFF', fg: on ? '#1E40AF' : '#334155', weight: on ? '700' : '600',
          pick: function () { if (!on) self.generate(n, 0); } };
      }),
      regen: function () { self.generate(tone, variant + 1); },
      close: function () { clearTimeout(self._g); self.setState({ phase: 'closed' }); },
      markDone: function () {
        clearTimeout(self._t);
        self.setState({ phase: 'done', toast: true });
        self._t = setTimeout(function () { self.setState({ toast: false }); }, 3200);
      },
      copy: function () {
        try { if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function () {}); } catch (e) {}
        clearTimeout(self._c); self.setState({ copied: true });
        self._c = setTimeout(function () { self.setState({ copied: false }); }, 2200);
      },
      copyLabel: st.copied ? 'Copiat! Deschidem Instagram…' : 'Copiază și deschide Instagram',
      copyIcon: st.copied ? 'M5 12.5l4.5 4.5L19 7.5' : 'M9 9h11v12H9zM5 15H4V4h11v1',
      toast: st.toast != null ? st.toast : isDone
    };
  }
}
</script>
</body>
</html>
