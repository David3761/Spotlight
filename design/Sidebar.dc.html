<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Meniu lateral</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Meniu principal" style="width: 100%; min-height: 100vh; box-sizing: border-box; background: #FFFFFF; padding: 24px 18px; display: flex; flex-direction: column; gap: 20px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F172A">
  <div style="display: flex; align-items: center; gap: 12px; padding: 0 6px">
    <div style="width: 36px; height: 36px; border-radius: 11px; background: #2563EB; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z" fill="#FFFFFF"></path></svg>
    </div>
    <span style="font-size: 17px; font-weight: 800; letter-spacing: -0.01em">[Nume aplicație]</span>
  </div>

  <button type="button" style="display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border-radius: 18px; border: 1px solid #E4E9F0; background: #F6F8FB; cursor: pointer; text-align: left; font-family: inherit; color: inherit">
    <span style="width: 40px; height: 40px; flex: none; border-radius: 13px; background: #EAF1FE; color: #1E40AF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">CB</span>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 14px; font-weight: 700">Cafeneaua Boema</span>
      <span style="font-size: 12px; color: #64748B">Cafenea · Cotroceni</span>
    </span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
  </button>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <sc-for list="{{ main }}" as="it" hint-placeholder-count="2">
      <a href="{{ it.href }}" aria-current="{{ it.current }}" style="display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px; border-radius: 14px; text-decoration: none; font-size: 14px; background: {{ it.bg }}; color: {{ it.fg }}; font-weight: {{ it.weight }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ it.icon }}"></path></svg>
        <span style="flex: 1">{{ it.name }}</span>
        <sc-if value="{{ it.hasMeta }}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 12px; font-weight: 700; color: #64748B">{{ it.meta }}</span>
        </sc-if>
      </a>
    </sc-for>
    <a href="/Conversatii.dc.html" aria-current="{{ chatCurrent }}" style="margin-top: 6px; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 12px; border-radius: 16px; text-decoration: none; background: #EAF1FE; color: #1E3A8A; border: {{ chatBorder }}">
      <span style="width: 36px; height: 36px; flex: none; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4zM8 9.5h8M8 12.5h5"></path></svg>
      </span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 14px; font-weight: 800">Conversații</span>
        <span style="font-size: 12px; font-weight: 600; color: #3B5BA9">Vorbește cu asistentul</span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 12px 6px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #64748B">Capitole</span>
      <span style="font-size: 11px; font-weight: 600; color: #64748B">de rezolvat</span>
    </div>
    <sc-for list="{{ chapters }}" as="it" hint-placeholder-count="8">
      <a href="{{ it.href }}" aria-current="{{ it.current }}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 12px; border-radius: 14px; text-decoration: none; font-size: 14px; line-height: 1.3; background: {{ it.bg }}; color: {{ it.fg }}; font-weight: {{ it.weight }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ it.iconColor }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{ it.icon }}"></path></svg>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span>{{ it.name }}</span>
          <sc-if value="{{ it.start }}" hint-placeholder-val="{{ false }}">
            <span style="display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #1D4ED8">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="#2563EB" aria-hidden="true"><path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z"></path></svg>
              Începe de aici
            </span>
          </sc-if>
        </span>
        <sc-if value="{{ it.hasCount }}" hint-placeholder-val="{{ true }}">
          <span aria-label="{{ it.countLabel }}" style="min-width: 26px; height: 24px; padding: 0 8px; border-radius: 999px; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; background: {{ it.badgeBg }}; color: {{ it.badgeFg }}">{{ it.count }}</span>
        </sc-if>
        <sc-if value="{{ it.allDone }}" hint-placeholder-val="{{ false }}">
          <span aria-label="Totul rezolvat" style="width: 24px; height: 24px; border-radius: 50%; background: #2FB36E; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          </span>
        </sc-if>
      </a>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding-top: 12px; border-top: 1px solid #EEF2F6">
    <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 14px; text-decoration: none; font-size: 14px; font-weight: 600; color: #334155">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9h16M9 20v-6h6v6"></path></svg>
      Datele afacerii
    </a>
    <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 14px; text-decoration: none; font-size: 14px; font-weight: 600; color: #334155">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"></path></svg>
      Ajutor
    </a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"panou","options":["panou","gemini","conversatii","profil","recenzii","continut","site","info","mentiuni","social","cunoaste"]},"override":{"editor":"text","default":""},"$preview":{"width":280,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active || 'panou';
    var ov = {};
    String(this.props.override || '').split(',').forEach(function (p) {
      var kv = p.split(':'); if (kv.length === 2) ov[kv[0].trim()] = Number(kv[1]);
    });
    var I = {
      home: 'M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
      target: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 12h.01',
      pin: 'M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21zM12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z',
      star: 'M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z',
      file: 'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6M9 9h2',
      eye: 'M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7S2.5 12 2.5 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
      list: 'M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2',
      news: 'M4 5h13v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM17 9h3v10a2 2 0 0 1-2 2M8 9h5M8 13h5M8 17h3',
      share: 'M18 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 22a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM8.6 13.5l6.8 4M15.4 6.5l-6.8 4',
      spark: 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z'
    };
    var deco = function (it) {
      var on = it.key === active;
      it.current = on ? 'page' : 'false';
      it.bg = on ? '#EAF1FE' : 'transparent';
      it.fg = on ? '#1E40AF' : '#334155';
      it.weight = on ? '700' : '600';
      it.iconColor = on ? '#2563EB' : '#64748B';
      return it;
    };
    var main = [
      { key: 'panou', name: 'Panou principal', href: '/Panou.dc.html', icon: I.home },
      { key: 'gemini', name: 'Vizibilitate în Gemini', href: '/Gemini.dc.html', icon: I.target, hasMeta: true, meta: '2/12' }
    ].map(deco);
    var chapters = [
      { key: 'profil', name: 'Profilul Google', count: 5, icon: I.pin, href: '/Capitol.dc.html' },
      { key: 'recenzii', name: 'Recenzii', count: 3, icon: I.star, href: '#' },
      { key: 'continut', name: 'Conținutul site-ului', count: 6, icon: I.file, href: '#', start: true },
      { key: 'site', name: 'Site-ul, văzut de Gemini', count: 4, icon: I.eye, href: '/FisaInfo.dc.html' },
      { key: 'info', name: 'Aceleași informații peste tot', count: 5, icon: I.list, href: '#' },
      { key: 'mentiuni', name: 'Mențiuni pe alte site-uri', count: 4, icon: I.news, href: '#' },
      { key: 'social', name: 'Rețele sociale', count: 3, icon: I.share, href: '/Rezolva.dc.html' },
      { key: 'cunoaste', name: 'Te cunoaște deja Gemini?', count: null, icon: I.spark, href: '#' }
    ].map(function (it) {
      deco(it);
      if (ov[it.key] != null && isFinite(ov[it.key])) it.count = ov[it.key];
      var on = it.key === active;
      it.hasCount = it.count != null && it.count > 0;
      it.allDone = it.count === 0;
      it.countLabel = it.count === 1 ? '1 problemă nerezolvată' : it.count + ' probleme nerezolvate';
      it.badgeBg = on ? '#2563EB' : '#F1F4F9';
      it.badgeFg = on ? '#FFFFFF' : '#334155';
      return it;
    });
    var chatOn = active === 'conversatii';
    return {
      main: main,
      chapters: chapters,
      chatCurrent: chatOn ? 'page' : 'false',
      chatBorder: chatOn ? '2px solid #2563EB' : '2px solid transparent'
    };
  }
}
</script>
</body>
</html>
